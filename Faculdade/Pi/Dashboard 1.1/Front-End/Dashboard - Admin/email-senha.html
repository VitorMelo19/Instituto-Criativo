            <nav class="sidebar-nav">

                    <li class="nav-item">

                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/calendar.svg">
                            </span>
                            <span>Eventos</span>
                        </a>
                    </li>

                    <li class="nav-item admin-only">
                        <a href="estatisticas.html" class="nav-link">
                            <span class="nav-icon">

        <header class="header">
        <h2>Alterar E-mail e Senha</h2>
        </header>

        <div class="card p-4 mb-4">
        <div class="grid grid-cols-2 gap-4">

            <!-- Alterar E-mail -->
            <div class="form-group">
            <label class="form-label" for="novoEmail">Novo E-mail</label>
            <input type="email" id="novoEmail" class="form-control" placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
            <label class="form-label" for="senhaAtualEmail">Senha Atual</label>
            <input type="password" id="senhaAtualEmail" class="form-control" placeholder="Digite sua senha atual">
            </div>

            <!-- Alterar Senha -->
            <div class="form-group">
            <label class="form-label" for="senhaAtual">Senha Atual</label>
            <input type="password" id="senhaAtual" class="form-control" placeholder="Digite sua senha atual">
            </div>
            <div class="form-group">
            <label class="form-label" for="novaSenha">Nova Senha</label>
            <input type="password" id="novaSenha" class="form-control" placeholder="Nova senha">
            </div>
            <div class="form-group">
            <label class="form-label" for="confirmaSenha">Confirmar Nova Senha</label>
            <input type="password" id="confirmaSenha" class="form-control" placeholder="Confirme a nova senha">
            </div>
        </div>

        <!-- Botões -->
        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn btn-primary" id="btnAlterarEmail">Alterar E-mail</button>
            <button class="btn btn-secondary" id="btnAlterarSenha" style="margin-left: 1rem;">Alterar Senha</button>
        </div>
    </div>
    </div>
    <script src="Js/script.js"></script>
    </body>
</html>
