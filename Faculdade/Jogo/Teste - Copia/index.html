<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Define a codificação de caracteres para UTF-8 -->
    <meta charset="UTF-8">
    <!-- Define a viewport para garantir que a página seja exibida corretamente em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="./Css/style.css">
    <!-- Link para o arquivo JavaScript externo, com defer para garantir que o script seja executado após o carregamento do HTML -->
    <script src="./Js/script.js" defer></script>
    <!-- Título da página -->
    <title>Jogo de Teste</title>
</head>
<body>
    <!-- Div que contém o tabuleiro do jogo -->
    <div class="game-board">
        <!-- Imagem das nuvens -->
        <img src="./Imagens/clouds.png" class="clouds">
        <!-- Imagem do Mario -->
        <img src="./Imagens/mario.gif" class="mario">
        <!-- Imagem do cano -->
        <img src="./Imagens/pipe.png" class="pipe">
    </div>
</body>
</html>
