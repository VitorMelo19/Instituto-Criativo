<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Instituto Criativo</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="/Front-End/imagens/logo3.svg" alt="Educa+" height="30">
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link active">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/home.svg">
                            </span>
                            <span>Home</span>
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="eventos.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/calendar.svg">
                            </span>
                            <span>Eventos</span>
                        </a>
                    </li>

                    <li class="nav-item admin-only">
                        <a href="estatisticas.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/bar-chart.svg">
                            </span>
                            <span>Estatísticas</span>
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="Acesso.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/user-check.svg">
                            </span>
                            <span>Acesso</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="Configurações.html" class="nav-link">
                            <span class="nav-icon">
                               <img src="/Front-End/imagens/icons/Configurações.svg"> <!-- arrumar expressura do icone -->
                            </span>
                            <span>Configurações</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Eventos</h2>
                
                <div class="header-actions">
                    <!-- Botão de adicionar evento (apenas para admin) -->
                    <button id="addEventBtn" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Adicionar Evento
                    </button>
                </div>
            </header>
            
            <!-- Filtros -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="filters">
                        <div class="filter-group">
                            <label for="eventType" class="form-label">Tipo de Evento</label>
                            <select id="eventType" class="form-control">
                                <option value="all">Todos</option>
                                <option value="palestra">Palestra</option>
                                <option value="workshop">Workshop</option>
                                <option value="curso">Curso</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label for="eventDate" class="form-label">Data</label>
                            <select id="eventDate" class="form-control">
                                <option value="all">Todas as datas</option>
                                <option value="today">Hoje</option>
                                <option value="week">Esta semana</option>
                                <option value="month">Este mês</option>
                            </select>
                        </div>
                        
                        <div class="filter-group">
                            <label for="eventSearch" class="form-label">Buscar</label>
                            <div class="search-input">
                                <input type="text" id="eventSearch" class="form-control" placeholder="Digite para buscar...">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Lista de Eventos -->
            <div class="card">
                <div class="card-body">
                    <div class="grid grid-cols-2 gap-4" id="eventsList">
                        <!-- Event cards will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Modal de Evento -->
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Adicionar Novo Evento</h3>
                <button class="modal-close">&times;</button>
            </div>
            
            <div class="modal-body">
  <form id="eventForm">
    <!-- Tipo de Cadastro -->
    <div class="form-group">
        <label for="cadastroTipo" class="form-label">Tipo de Cadastro</label>
        <select id="cadastroTipo" class="form-control" required>
            <option value="evento">Evento</option>
            <option value="curso">Curso</option>
        </select>
    </div>

    <!-- FORMULÁRIO DE EVENTO -->
    <div id="formEvento">
        <div class="form-group">
            <label for="eventTitle" class="form-label">Título do Evento</label>
            <input type="text" id="eventTitle" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="eventDescription" class="form-label">Descrição</label>
            <textarea id="eventDescription" class="form-control" rows="4" required></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label for="eventDate" class="form-label">Data</label>
                <input type="date" id="eventDate" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="eventLocal" class="form-label">Local</label>
                <input type="text" id="eventLocal" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label for="eventImage" class="form-label">Imagem</label>
            <input type="file" id="eventImage" class="form-control" accept="image/*" required>
        </div>

        <div id="previewContainer" class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Pré-visualização:</label>
            <img id="previewImage" style="max-width: 100%; border-radius: 8px; display: none;" />
        </div>
    </div>

    <!-- FORMULÁRIO DE CURSO -->
    <div id="formCurso" style="display: none;">
        <div class="form-group">
            <label for="cursoTitulo" class="form-label">Título do Curso</label>
            <input type="text" id="cursoTitulo" class="form-control">
        </div>

        <div class="form-group">
            <label for="cursoDescricao" class="form-label">Descrição</label>
            <textarea id="cursoDescricao" class="form-control" rows="4"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="form-group">
                <label for="cursoHoras" class="form-label">Carga Horária</label>
                <input type="text" id="cursoHoras" class="form-control" placeholder="Ex: 30 horas">
            </div>

            <div class="form-group">
                <label for="cursoNivel" class="form-label">Nível</label>
                <select id="cursoNivel" class="form-control">
                    <option value="iniciante">Iniciante</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="cursoLink" class="form-label">Link do Curso</label>
            <input type="url" id="cursoLink" class="form-control" placeholder="https://...">
        </div>

        <div class="form-group">
            <label for="cursoImagem" class="form-label">Imagem</label>
            <input type="file" id="cursoImagem" class="form-control" accept="image/*">
        </div>

        <div id="cursoPreview" class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Pré-visualização:</label>
            <img id="cursoPreviewImage" style="max-width: 100%; border-radius: 8px; display: none;" />
        </div>
    </div>

    <div class="form-actions" style="text-align: right;">
        <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
</form>
    </div>
    </div>
    </div>


              
    
    <script src="js/eventos.js"></script>
</body>
</html>
