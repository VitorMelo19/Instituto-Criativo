<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Instituto Criativo</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                    <img src="/Front-End/imagens/logo3.svg" alt="Educa+" height="30">                
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li class="nav-item">
                        <a href="dashboard.html" class="nav-link active">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/home.svg">
                            </span>
                            <span>Home</span>
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="eventos.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/calendar.svg">
                            </span>
                            <span>Eventos</span>
                        </a>
                    </li>

                    <li class="nav-item admin-only">
                        <a href="estatisticas.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/bar-chart.svg">
                            </span>
                            <span>Estatísticas</span>
                        </a>
                    </li>
                    
                    <li class="nav-item">
                        <a href="Acesso.html" class="nav-link">
                            <span class="nav-icon">
                                <img src="/Front-End/imagens/icons/user-check.svg">
                            </span>
                            <span>Acesso</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="Configurações.html" class="nav-link">
                            <span class="nav-icon">
                               <img src="/Front-End/imagens/icons/Configurações.svg"> <!-- arrumar expressura do icone -->
                            </span>
                            <span>Configurações</span>
                        </a>
                    </li>
                    
                </ul>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Dashboard</h2>
                
                <div class="user-menu">
                        <span class="nome">Nome do cliente</span>
                        <div class="foto-user"><img src="User.jpg" alt="User"></div>
                </div>
            </header>
            <!-- CONTEÚDO PRINCIPAL -->
            <main class="conteudo">
                <div class="graficos-container">
                    <section class="grafico-servicos1">
                        <canvas id="graficoServicos1"></canvas>
                    </section>
            
                    <section class="grafico-servicos2">
                        <canvas id="graficoServicos2"></canvas>
                    </section>
                </div>
            </main>
            

            <!-- Próximos Eventos -->
            <div class="card mb-4">
                <div class="card-header">
                    <h3>Próximos Eventos</h3>
                </div>
                
                <div class="card-body">
                    <div class="grid grid-cols-3 gap-4" id="upcomingEvents">
                        <!-- Event cards will be loaded here -->
                    </div>
                </div>
                
                <div class="card-footer text-center">
                    <a href="eventos.html" class="text-link">Ver todos os eventos</a>
                </div>
            </div>
            
            <!-- Minhas Inscrições - ISSO FICA NO DASHBOARD DO ALUNO
            <div class="card">
                <div class="card-header">
                    <h3>Minhas Inscrições</h3>
                </div>
                
                <div class="card-body">
                    <div class="grid grid-cols-2 gap-4" id="myRegistrations">
                         Registration cards will be loaded here 
                    </div>
                </div>
            </div> -->
        </main>
    </div>
    
    <script src="js/dashboard.js"></script>
</body>
</html>
